# Повний приклад для isi.gov.ua (aaPanel / nginx).
# root = /www/wwwroot/isi.gov.ua/dist
#
# ВАЖЛИВО: у dist є каталоги news/1/, news/27/ з фото.
# Без блоку «SPA news» адреса /news/27/ після F5 дає 403 Forbidden.

server {
    listen 80;
    listen 443 ssl http2;
    server_name isi.gov.ua www.isi.gov.ua;

    root /www/wwwroot/isi.gov.ua/dist;
    index index.html;

    # --- Кеш і статика ---

    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* ^/news-data\.(ua|en)\.json$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Фото новин: /news/27/27-1.png (файл з розширенням)
    location ~* ^/news/\d+/.+\.(jpg|jpeg|png|gif|webp|svg|JPG|JPEG|PNG|GIF|WEBP|SVG)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Сторінка новини в SPA: /news/27 та /news/27/ — НЕ відкривати каталог на диску
    location ~ ^/news/\d+/?$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # Решта сайту (SPA)
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
