# Після кожного деплою користувачі мають отримувати НОВИЙ index.html (з новими іменами *.js у /assets/).
# Файли в /assets/ уже містять hash у назві — їх можна кешувати довго.
#
# Приклад для root = dist після npm run build.

# Версія збірки — клієнт порівнює при кожному візиті (no-store)
location = /version.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
}

# Список новин (runtime fetch) — ім'я без «feed», щоб десктопний AdBlock не різав запит
location ~* ^/news-data\.(ua|en)\.json$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
}

location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# SPA: кореневий location — не ставте expires 7d на весь сайт; інакше закешується старий index.html
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
}
