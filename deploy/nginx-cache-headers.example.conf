# Після кожного деплою користувачі мають отримувати НОВИЙ index.html (з новими іменами *.js у /assets/).
# Повний приклад: deploy/nginx-site.conf
#
# root = /www/wwwroot/isi.gov.ua/dist

# /news/27/ після F5 → 403, бо на диску є папка dist/news/27/ з фото.
# Сторінка новини (лише число), не каталог:
location ~ ^/news/\d+/?$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files /index.html =404;
}

# Фото: /news/27/27-1.png
location ~* ^/news/\d+/.+\.(jpg|jpeg|png|gif|webp|svg|JPG|JPEG|PNG|GIF|WEBP|SVG)$ {
    try_files $uri =404;
}

# Версія збірки — клієнт порівнює при кожному візиті (no-store)
location = /version.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
}

# Список новин (runtime fetch) — ім'я без «feed», щоб десктопний AdBlock не різав запит
location ~* ^/news-data\.(ua|en)\.json$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
}

location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# SPA: кореневий location — не ставте expires 7d на весь сайт; інакше закешується старий index.html
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
}
